<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Grocery Item</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1>Update Grocery Item</h1>

    <form method="post" th:object="${grocery}" th:action="@{/groceries/{id}(id=${grocery.id})}">
        <input type="hidden" name="_method" value="PUT">

        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" th:field="*{quantity}" min="1">
        </div>

        <div class="form-group">
            <label for="category">Category:</label>
            <input type="text" id="category" th:field="*{category}">
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" th:field="*{purchased}"> Purchased
            </label>
        </div>

        <button type="submit" class="btn">Update Item</button>
        <a th:href="@{/groceries}" class="btn" style="background-color: #95a5a6; margin-left: 10px;">Cancel</a>
    </form>
</div>
</body>
</html>
