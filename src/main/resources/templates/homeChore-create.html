<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create chore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1>Create new chore</h1>
    <form th:action="@{/homeChore}" th:object="${homeChore}" method="post">
        <div class="form-group">
            <label for="chore">Chore</label>
            <input id="chore" type="text" th:field="*{chore}" required/>
        </div>

        <div class="form-group">
            <label for="room">Room</label>
            <input id="room" type="text" th:field="*{room}" required/>
        </div>

        <div class="form-group">
            <label for="important">Important:
                <input id="important" type="checkbox" th:field="*{important}" value="true" style="width: auto; margin-left: 10px;"/>
            </label>
        </div>

        <div class="form-group">
            <label for="estimatedTime">Estimated time (min)</label>
            <input id="estimatedTime" type="number" th:field="*{estimatedTime}" required min="1" max="60"/>
        </div>

        <button type="submit" class="btn">Save</button>
    </form>
    <br>
    <a th:href="@{/homeChore}" class="back-link">Back to list of all chores</a>
</div>
</body>
</html>
