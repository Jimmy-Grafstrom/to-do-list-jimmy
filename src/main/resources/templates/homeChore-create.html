<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Home Chore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1>Create New Home Chore</h1>
    <form th:action="@{/homeChore}" th:object="${homeChore}" method="post">
        <div class="form-group">
            <label for="chore">Chore Name:</label>
            <input id="chore" type="text" th:field="*{chore}" required/>
        </div>

        <div class="form-group">
            <label for="room">Room:</label>
            <input id="room" type="text" th:field="*{room}" required/>
        </div>

        <div class="form-group">
            <label>
                <input id="important" type="checkbox" th:field="*{important}" value="true"/> Important
            </label>
        </div>

        <div class="form-group">
            <label for="estimatedTime">Estimated time (min):</label>
            <input id="estimatedTime" type="number" th:field="*{estimatedTime}" required min="1" max="1440"/>
        </div>

        <button type="submit" class="btn">Save Chore</button>
        <a th:href="@{/homeChore}" class="btn" style="background-color: #95a5a6; margin-left: 10px;">Cancel</a>
    </form>
</div>
</body>
</html>
