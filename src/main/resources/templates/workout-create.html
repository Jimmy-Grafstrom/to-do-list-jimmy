<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Workout</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    <div class="container">
        <h1>Create New Workout</h1>
        <form th:action="@{/workout}" th:object="${workoutSession}" method="post">
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" th:field="*{date}" required />
            </div>
            <div class="form-group">
                <label for="exerciseType">Exercise Type:</label>
                <input type="text" id="exerciseType" th:field="*{exerciseType}" required />
            </div>
            <div class="form-group">
                <label for="durationInMinutes">Duration (minutes):</label>
                <input type="number" id="durationInMinutes" th:field="*{durationInMinutes}" min="1" required />
            </div>
            <div class="form-group">
                <label for="intensity">Intensity (1-10):</label>
                <input type="number" id="intensity" th:field="*{intensity}" min="1" max="10" value="1" required />
            </div>
            <button type="submit" class="btn">Save Workout</button>
            <a th:href="@{/workout}" class="btn" style="background-color: #95a5a6; margin-left: 10px;">Cancel</a>
        </form>
    </div>
</body>
</html>
