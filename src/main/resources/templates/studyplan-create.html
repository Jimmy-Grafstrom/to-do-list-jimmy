<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Studyplan</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1>Create New Studyplan</h1>
    <form th:action="@{/studyplan}" th:object="${studyplan}" method="post">
        <div class="form-group">
            <label for="task">Task:</label>
            <input type="text" id="task" th:field="*{task}" required />
        </div>
        <div class="form-group">
            <label for="priority">Priority (0-100):</label>
            <input type="number" id="priority" th:field="*{priority}" min="0" max="100" required />
        </div>
        <div class="form-group">
            <label for="coursename">Course Name:</label>
            <input type="text" id="coursename" th:field="*{coursename}" required />
        </div>
        <div class="form-group">
            <label for="startdate">Start Date:</label>
            <input type="date" id="startdate" th:field="*{startdate}"/>
        </div>
        <div class="form-group">
            <label for="deadline">Deadline:</label>
            <input type="date" id="deadline" th:field="*{deadline}" required />
        </div>
        <button type="submit" class="btn">Create</button>
    </form>
    <br>
    <a th:href="@{/studyplan}" class="back-link">Cancel</a>
</div>
</body>
</html>
