<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Study Plan</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1>Update Study Plan</h1>

    <form th:action="@{/studyplan/{id}(id=${studyplan.id})}" th:object="${studyplan}" method="post">
        <input type="hidden" name="_method" value="put"/>

        <div class="form-group">
            <label for="task">Task:</label>
            <input type="text" id="task" th:field="*{task}" required />
        </div>
        <div class="form-group">
            <label for="priority">Priority (0-100):</label>
            <input type="number" id="priority" th:field="*{priority}" min="0" max="100" required />
        </div>
        <div class="form-group">
            <label for="coursename">Course Name:</label>
            <input type="text" id="coursename" th:field="*{coursename}" required />
        </div>
        <div class="form-group">
            <label for="startdate">Start Date:</label>
            <input type="date" id="startdate" th:field="*{startdate}" required />
        </div>
        <div class="form-group">
            <label for="deadline">Deadline:</label>
            <input type="date" id="deadline" th:field="*{deadline}" required />
        </div>

        <button type="submit" class="btn">Update Plan</button>
        <a th:href="@{/studyplan}" class="btn" style="background-color: #95a5a6; margin-left: 10px;">Cancel</a>
    </form>
</div>
</body>
</html>
