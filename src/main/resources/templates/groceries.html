<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery list</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1>Groceries</h1>

    <a th:href="@{/groceries/new}" class="btn" style="margin-bottom: 20px;">Add grocery</a>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Quantity</th>
                <th>Category</th>
                <th>Purchased</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="grocery : ${groceries}">
                <td th:text="${grocery.name}"></td>
                <td th:text="${grocery.quantity}"></td>
                <td th:text="${grocery.category}"></td>
                <td th:text="${grocery.purchased ? 'Yes' : 'No'}"></td>
                <td class="action-links">
                    <a th:href="@{/groceries/{id}(id=${grocery.id})}" class="btn">Info</a>
                    <a th:href="@{/groceries/{id}/edit(id=${grocery.id})}" class="btn">Update</a>
                    <form th:action="@{/groceries/{id}(id=${grocery.id})}" method="post" style="display: inline">
                        <input type="hidden" name="_method" value="DELETE">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this item?')">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <br>
    <a th:href="@{/}" class="back-link">Back to Homepage</a>
</div>
</body>
</html>
