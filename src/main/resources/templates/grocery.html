<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery Item Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1>Grocery Item Details</h1>

    <p><strong>Name:</strong> <span th:text="${grocery.name}"></span></p>
    <p><strong>Quantity:</strong> <span th:text="${grocery.quantity}"></span></p>
    <p><strong>Category:</strong> <span th:text="${grocery.category}"></span></p>
    <p><strong>Status:</strong>
        <span th:text="${grocery.purchased ? 'Purchased' : 'Not purchased'}"></span>
    </p>

    <br>
    <div class="action-links">
        <a th:href="@{/groceries}" class="btn">Back to List</a>
        <a th:href="@{/groceries/{id}/edit(id=${grocery.id})}" class="btn">Edit</a>
        <form th:action="@{/groceries/{id}(id=${grocery.id})}" method="post" style="display: inline">
            <input type="hidden" name="_method" value="DELETE">
            <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this item?')">Delete</button>
        </form>
    </div>
</div>
</body>
</html>
