<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workout Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    <div class="container">
        <h1>Workout Details</h1>
        <p><strong>Date:</strong> <span th:text="${workoutSession.date}"></span></p>
        <p><strong>Exercise:</strong> <span th:text="${workoutSession.exerciseType}"></span></p>
        <p><strong>Duration:</strong> <span th:text="${workoutSession.durationInMinutes}"></span> minutes</p>
        <p><strong>Intensity:</strong> <span th:text="${workoutSession.intensity}"></span> / 10</p>

        <br>
        <div class="action-links">
            <a th:href="@{/workout}" class="btn">Back to List</a>
            <a th:href="@{/workout/{id}/edit(id=${workoutSession.id})}" class="btn">Edit</a>
            <form th:action="@{/workout/{id}(id=${workoutSession.id})}" th:method="delete" style="display:inline;">
                <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this workout?')">Delete</button>
            </form>
        </div>
    </div>
</body>
</html>
