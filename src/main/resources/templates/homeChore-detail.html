<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home Chore Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1>Home Chore Details</h1>
    <p><strong>Chore:</strong> <span th:text="${homeChore.chore}"></span></p>
    <p><strong>Room:</strong> <span th:text="${homeChore.room}"></span></p>
    <p><strong>Status:</strong> <span th:text="${homeChore.important ? 'Important' : 'Standard'}"></span></p>
    <p><strong>Estimated Time:</strong> <span th:text="${homeChore.estimatedTime}"></span> minutes</p>

    <br>
    <div class="action-links">
        <a th:href="@{/homeChore}" class="btn">Back to List</a>
        <a th:href="@{/homeChore/{id}/edit(id=${homeChore.id})}" class="btn">Edit</a>
        <form th:action="@{/homeChore/{id}(id=${homeChore.id})}" method="post" style="display: inline">
            <input type="hidden" name="_method" value="DELETE">
            <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this chore?')">Delete</button>
        </form>
    </div>
</div>
</body>
</html>
