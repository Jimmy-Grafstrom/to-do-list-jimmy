<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workout Sessions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>
    <div class="container">
        <h1>Workout Sessions</h1>
        <a th:href="@{/workout/new}" class="btn" style="margin-bottom: 20px;">Add New Workout</a>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Exercise</th>
                    <th>Duration (min)</th>
                    <th>Intensity (1-10)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="workout : ${workoutSessions}">
                    <td th:text="${workout.date}"></td>
                    <td th:text="${workout.exerciseType}"></td>
                    <td th:text="${workout.durationInMinutes}"></td>
                    <td th:text="${workout.intensity}"></td>
                    <td class="action-links">
                        <a th:href="@{/workout/{id}(id=${workout.id})}" class="btn">Info</a>
                        <a th:href="@{/workout/{id}/edit(id=${workout.id})}" class="btn">Update</a>
                        <form th:action="@{/workout/{id}(id=${workout.id})}" th:method="delete" style="display:inline;">
                            <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this workout?')">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <br>
        <a th:href="@{/}" class="back-link">Back to Homepage</a>
    </div>
</body>
</html>
