<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Grocery Item</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1>New Grocery Item</h1>

    <form method="post" th:action="@{/groceries}">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1">
        </div>

        <div class="form-group">
            <label for="category">Category:</label>
            <input type="text" id="category" name="category">
        </div>

        <input type="hidden" name="purchased" value="false">

        <button type="submit" class="btn">Add to List</button>
        <a th:href="@{/groceries}" class="btn" style="background-color: #95a5a6; margin-left: 10px;">Cancel</a>
    </form>
</div>
</body>
</html>
